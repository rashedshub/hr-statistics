<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Statistics Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>

<div class="topbar">
  <h1><i data-lucide="bar-chart-3"></i> HR Statistics for <span class="site-name" id="siteNameLabel">—</span></h1>
  <div class="controls">
    <select id="siteSelect"></select>
    <select id="periodSelect"></select>
    <a class="btn" href="admin.html"><i data-lucide="lock"></i> Admin</a>
  </div>
</div>

<main>
  <div id="stateMsg" class="state-msg">Loading dashboard…</div>
  <div class="grid" id="grid" style="display:none;"></div>
</main>

<script type="module" src="js/app.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
