<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Statistics Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="hs-topbar">
  <h1 class="hs-title">HR STATISTICS</h1>

  <div class="hs-topbar-item">
    Period: [ <select id="periodSelect"></select> ]
  </div>

  <div class="hs-topbar-item hs-topbar-right">
    Plant: [ <select id="siteSelect"></select> ]
    <a class="hs-admin-link" href="admin.html" title="Admin">⚙</a>
  </div>
</div>

<main>
  <div id="stateMsg" class="state-msg">Loading dashboard…</div>

  <div id="topicsWrap" class="hs-panels" style="display:none;">

    <!-- Leave Consumption -->
    <div class="stat-panel clickable-panel" id="leavePanel" title="Click for month-by-month detail">
      <div class="stat-panel-header">Leave Consumption <span class="detail-hint">▸ click for detail</span></div>
      <div class="stat-panel-body">
        <div class="stat-body-cols">
          <div class="stat-labels">
            <div class="stat-row"><span>Total EL (Plan)</span><b id="leaveTotalPlan">–</b></div>
            <div class="stat-row"><span>This Month</span><b id="leaveMonthActual">–</b></div>
            <div class="stat-row"><span>YTD</span><b id="leaveYtdActual">–</b></div>
          </div>
          <div class="stat-bars">
            <div class="stat-bars-title">Plan vs Actual</div>
            <div class="progress-track">
              <div class="progress-fill" id="leaveMonthBar" style="width:0%;"><span id="leaveMonthPct">0%</span></div>
            </div>
            <div class="progress-track">
              <div class="progress-fill" id="leaveYtdBar" style="width:0%;"><span id="leaveYtdPct">0%</span></div>
            </div>
          </div>
        </div>
        <div class="category-tag"><b>Non-Worker</b> – Asst. Officer to above level</div>
      </div>
    </div>

    <!-- Sick Leave -->
    <div class="stat-panel">
      <div class="stat-panel-header">Sick Leave</div>
      <div class="stat-panel-body">
        <div class="stat-body-cols">
          <div class="stat-labels">
            <div class="stat-row"><span>This Month</span><b id="sickMonthDays">–</b></div>
            <div class="stat-row"><span>YTD</span><b id="sickYtdDays">–</b></div>
          </div>
          <div class="big-figure-box">
            <div class="big-figure" id="sickPct">0%</div>
          </div>
        </div>
        <div class="category-tag"><b>Worker</b> – Sewing (Operator)</div>
      </div>
    </div>

  </div>

  <!-- Leave Consumption detail modal -->
  <div id="leaveDetailModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="leaveDetailTitle">Leave Consumption — detail</h3>
        <button class="modal-close" id="leaveDetailClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="chart-wrap"><canvas id="leaveDetailChart"></canvas></div>
        <table class="detail-table">
          <thead><tr><th>Month</th><th>Plan</th><th>Actual</th><th>%</th></tr></thead>
          <tbody id="leaveDetailTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
